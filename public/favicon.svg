<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1c5fde" />
      <stop offset="0.5" stop-color="#2184c8" />
      <stop offset="1" stop-color="#16918f" />
    </linearGradient>
    <radialGradient id="sheen" cx="0.35" cy="0.28" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="hole">
      <rect width="24" height="24" fill="#fff" />
      <circle cx="17.3" cy="15.2" r="2" fill="#000" />
    </mask>
  </defs>
  <!-- Bare mark: transparent background, no tile -->
  <g transform="translate(8 8) scale(2)">
