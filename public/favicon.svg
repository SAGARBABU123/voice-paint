    <circle cx="8.4" cy="9.2" r="1.3" fill="#ffd166" stroke="#fff" stroke-width="0.55" />
    <circle cx="13.4" cy="7.3" r="1.3" fill="#ffffff" stroke="rgba(13,38,74,0.12)" stroke-width="0.5" />
    <circle cx="18" cy="11.8" r="1.3" fill="#c08dff" stroke="#fff" stroke-width="0.55" />
    <circle cx="10.2" cy="16.6" r="1.3" fill="#ff8fb0" stroke="#fff" stroke-width="0.55" />
  </g>
