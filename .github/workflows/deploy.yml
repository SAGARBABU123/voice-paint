name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  pages:
    name: Deploy app to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build app
        run: npm run build
        env:
          VITE_WHISPER_ENDPOINT: ${{ secrets.VITE_WHISPER_ENDPOINT }}
          VITE_WHISPER_LANGUAGE: ${{ secrets.VITE_WHISPER_LANGUAGE }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=voice-over-paint

  whisper:
    name: Deploy Whisper worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: whisper-worker
          command: deploy
